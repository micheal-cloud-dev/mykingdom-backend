# ─────────────────────────────────────────────
#  MY KINGDOM - Application Configuration
# ─────────────────────────────────────────────
spring.application.name=mykingdom-backend
server.port=${PORT:8080}

# ─────────────────────────────────────────────
#  MySQL Database (uses env vars for Render)
# ─────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:mykingdom_db}?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=6777
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# ─────────────────────────────────────────────
#  JPA / Hibernate
# ─────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────
#  JWT Configuration
# ─────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:MyKingdomSuperSecretKeyForJWTTokenGeneration2025@Tirunelveli!SecureKey}
app.jwt.access-token-expiry=86400000
app.jwt.refresh-token-expiry=604800000

# ─────────────────────────────────────────────
#  CORS Configuration
# ─────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ORIGINS:https://myschool-delta.vercel.app,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}

# ─────────────────────────────────────────────
#  Logging
# ─────────────────────────────────────────────
logging.level.com.mykingdom=INFO
logging.level.org.springframework.security=WARN
