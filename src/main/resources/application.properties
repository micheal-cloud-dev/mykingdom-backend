spring.application.name=mykingdom-backend
server.port=${PORT:8080}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mykingdom_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# JWT
app.jwt.secret=${JWT_SECRET:MyKingdomSuperSecretKeyForJWTTokenGeneration2025@Tirunelveli!SecureKey}
app.jwt.access-token-expiry=86400000
app.jwt.refresh-token-expiry=604800000

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:https://myschool-delta.vercel.app,http://localhost:3000,http://127.0.0.1:5500}

logging.level.com.mykingdom=INFO
logging.level.org.springframework.security=WARN